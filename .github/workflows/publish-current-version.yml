name: Criar release versionada

on:
  workflow_dispatch:
    inputs:
      increment:
        description: Incremento SemVer
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      keep_releases:
        description: Quantidade de releases estáveis a manter
        required: true
        default: '10'

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  GELITA_MARINGA_PRINT_SERVER: '\\ci\maringa'
  GELITA_MARINGA_PRINTER_NETWORK: '192.0.2'
  GELITA_COTIA_PRINT_SERVER: '\\ci\cotia'
  GELITA_COTIA_PRINTER_NETWORK: '198.51.100'
  GELITA_MOCOCA_PRINT_SERVER: '\\ci\mococa'
  GELITA_MOCOCA_PRINTER_NETWORK: '203.0.113'
  GELITA_OFFICE_ODT_DIRECTORY: 'C:\ci\office'
  GELITA_OFFICE_CONFIGURATION: 'C:\ci\office\configuration.xml'

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Baixar histórico completo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Configurar .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.423

      - name: Calcular próxima versão
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content .\Gelita-IT-Toolkit.csproj -Raw
          [version]$current = @($project.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          $next = switch ('${{ inputs.increment }}') {
            'major' { [version]::new($current.Major + 1, 0, 0) }
            'minor' { [version]::new($current.Major, $current.Minor + 1, 0) }
            default { [version]::new($current.Major, $current.Minor, $current.Build + 1) }
          }
          $version = $next.ToString(3)
          $tag = "v$version"
          if (git tag --list $tag) { throw "A tag $tag já existe." }
          $previousTag = git describe --tags --abbrev=0 2>$null
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "previous_tag=$previousTag" >> $env:GITHUB_OUTPUT

      - name: Atualizar projeto, CHANGELOG e release notes
        shell: pwsh
        run: |
          .\Scripts\Set-ReleaseVersion.ps1 `
            -Version '${{ steps.version.outputs.version }}' `
            -PreviousTag '${{ steps.version.outputs.previous_tag }}' `
            -ReleaseNotesPath .\release-notes.md

      - name: Restaurar, auditar, compilar e testar
        shell: pwsh
        run: |
          dotnet restore .\Gelita-IT-Toolkit.sln -p:NuGetAudit=true -p:NuGetAuditMode=all -warnaserror:NU1900,NU1901,NU1902,NU1903,NU1904
          dotnet build .\Gelita-IT-Toolkit.sln -c Release --no-restore --warnaserror
          dotnet test .\Tests\Gelita-IT-Toolkit.SmokeTests.csproj -c Release --no-build --no-restore

      - name: Compilar pacote portátil
        shell: pwsh
        run: |
          dotnet publish .\Gelita-IT-Toolkit.csproj -c Release -r win-x64 --self-contained true `
            -p:Version='${{ steps.version.outputs.version }}' `
            -p:AssemblyVersion='${{ steps.version.outputs.version }}.0' `
            -p:FileVersion='${{ steps.version.outputs.version }}.0' `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None -p:DebugSymbols=false -o .\publish
          @{ version='${{ steps.version.outputs.version }}'; tag='${{ steps.version.outputs.tag }}' } |
            ConvertTo-Json | Set-Content .\publish\version.json -Encoding utf8

      - name: Validar conteúdo portátil
        shell: pwsh
        run: |
          $required = @(
            '.\publish\Gelita-IT-Toolkit.exe',
            '.\publish\Config\printers.json',
            '.\publish\Config\toolkit-settings.json',
            '.\publish\Config\installer-hashes.json',
            '.\publish\Config\security-policy.json',
            '.\publish\Assets',
            '.\publish\LEIA-ME.txt',
            '.\publish\Abrir-Gelita-IT-Toolkit.cmd',
            '.\publish\version.json'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Conteúdo obrigatório ausente: $path" }
          }
          Get-ChildItem .\publish\Config\*.json | ForEach-Object {
            Get-Content -LiteralPath $_.FullName -Raw -Encoding utf8 | ConvertFrom-Json | Out-Null
          }
          if (Test-Path -LiteralPath .\publish\.env) {
            throw 'Configuração local foi incluída antes da etapa de assinatura.'
          }

      - name: Assinar executável
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          EXPECTED_THUMBPRINT: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT }}
        run: |
          foreach ($value in 'CERTIFICATE_BASE64','CERTIFICATE_PASSWORD','EXPECTED_THUMBPRINT') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($value))) {
              throw "Secret $value ausente."
            }
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
            $password = ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate $pfx Cert:\CurrentUser\My -Password $password
            $expected = $env:EXPECTED_THUMBPRINT.Replace(' ', '').ToUpperInvariant()
            if ($certificate.Thumbprint -ne $expected) { throw 'PFX e thumbprint não correspondem.' }
            $signature = Set-AuthenticodeSignature .\publish\Gelita-IT-Toolkit.exe $certificate `
              -TimestampServer 'http://timestamp.digicert.com' -HashAlgorithm SHA256
            if ($signature.Status -ne 'Valid') { throw "Assinatura inválida: $($signature.StatusMessage)" }
            "GELITA_TOOLKIT_SIGNER_THUMBPRINT=$expected" | Set-Content .\publish\.env -Encoding ascii
          }
          finally {
            if ($certificate) { Remove-Item "Cert:\CurrentUser\My\$($certificate.Thumbprint)" -Force -ErrorAction SilentlyContinue }
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Gerar pacote e validar identidade da versão
        id: package
        shell: pwsh
        run: |
          $name = 'Gelita-IT-Toolkit-v${{ steps.version.outputs.version }}-win-x64'
          $zip = Join-Path $PWD "$name.zip"
          $items = @('.\publish\*', '.\publish\.env')
          Compress-Archive -Path $items -DestinationPath $zip -CompressionLevel Optimal
          .\Scripts\Test-ReleaseVersion.ps1 `
            -ExpectedVersion '${{ steps.version.outputs.version }}' `
            -ExpectedTag '${{ steps.version.outputs.tag }}' `
            -ExecutablePath .\publish\Gelita-IT-Toolkit.exe -ZipPath $zip
          $hashPath = "$zip.sha256"
          "$(Get-FileHash $zip -Algorithm SHA256 | Select-Object -ExpandProperty Hash)  $name.zip" |
            Set-Content $hashPath -Encoding ascii
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "hash=$hashPath" >> $env:GITHUB_OUTPUT

      - name: Confirmar versão no Git e criar tag
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Gelita-IT-Toolkit.csproj CHANGELOG.md
          git commit -m "Release ${{ steps.version.outputs.tag }}"
          git push origin HEAD:main
          git tag -a '${{ steps.version.outputs.tag }}' -m 'Release ${{ steps.version.outputs.tag }}'
          git push origin '${{ steps.version.outputs.tag }}'

      - name: Criar GitHub Release e release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ steps.version.outputs.tag }}' `
            '${{ steps.package.outputs.zip }}' '${{ steps.package.outputs.hash }}' `
            --verify-tag --title '${{ steps.version.outputs.tag }}' `
            --notes-file .\release-notes.md --generate-notes

      - name: Aplicar retenção de releases antigas
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [int]$keep = '${{ inputs.keep_releases }}'
          if ($keep -lt 1 -or $keep -gt 50) { throw 'Retenção deve estar entre 1 e 50.' }
          $old = gh release list --limit 100 --json tagName,isDraft,isPrerelease,createdAt |
            ConvertFrom-Json | Where-Object { -not $_.isDraft -and -not $_.isPrerelease } |
            Sort-Object createdAt -Descending | Select-Object -Skip $keep
          foreach ($release in $old) {
            gh release delete $release.tagName --cleanup-tag --yes
            if ($LASTEXITCODE -ne 0) { throw "Falha ao remover $($release.tagName)." }
          }
