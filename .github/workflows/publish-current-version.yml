name: Publicar pacote da versão atual

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Configurar .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.423

      - name: Ler versão atual
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content Gelita-IT-Toolkit.csproj
          $version = ($project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Versão não encontrada no projeto.' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Executar testes
        shell: pwsh
        run: dotnet test .\Tests\Gelita-IT-Toolkit.SmokeTests.csproj -c Release

      - name: Compilar pacote portátil
        shell: pwsh
        run: |
          dotnet publish .\Gelita-IT-Toolkit.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o .\publish

      - name: Assinar e validar executável
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          EXPECTED_SIGNER_THUMBPRINT: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_BASE64)) { throw 'Secret WINDOWS_SIGNING_CERTIFICATE_BASE64 ausente.' }
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_PASSWORD)) { throw 'Secret WINDOWS_SIGNING_CERTIFICATE_PASSWORD ausente.' }
          if ([string]::IsNullOrWhiteSpace($env:EXPECTED_SIGNER_THUMBPRINT)) { throw 'Secret WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT ausente.' }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'gelita-toolkit-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64))
            $password = ConvertTo-SecureString $env:SIGNING_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
            $expected = $env:EXPECTED_SIGNER_THUMBPRINT.Replace(' ', '').ToUpperInvariant()
            if ($certificate.Thumbprint -ne $expected) { throw 'O PFX não corresponde ao thumbprint autorizado.' }
            $signature = Set-AuthenticodeSignature -LiteralPath .\publish\Gelita-IT-Toolkit.exe -Certificate $certificate -TimestampServer 'http://timestamp.digicert.com' -HashAlgorithm SHA256
            if ($signature.Status -ne 'Valid') { throw "Falha ao assinar: $($signature.StatusMessage)" }
            if ($signature.SignerCertificate.Thumbprint -ne $expected) { throw 'Validação do assinante falhou.' }
            "GELITA_TOOLKIT_SIGNER_THUMBPRINT=$expected" | Set-Content -LiteralPath .\publish\.env -Encoding ascii
          }
          finally {
            if ($certificate) { Remove-Item -LiteralPath "Cert:\CurrentUser\My\$($certificate.Thumbprint)" -Force -ErrorAction SilentlyContinue }
            Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Validar conteúdo do pacote
        shell: pwsh
        run: |
          $requiredPaths = @(
            '.\publish\Gelita-IT-Toolkit.exe',
            '.\publish\Config\printers.json',
            '.\publish\Config\toolkit-settings.json',
            '.\publish\Assets',
            '.\publish\LEIA-ME.txt',
            '.\publish\Abrir-Gelita-IT-Toolkit.cmd'
          )
          foreach ($path in $requiredPaths) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Arquivo obrigatório ausente do pacote: $path"
            }
          }
          if ('${{ github.event_name }}' -ne 'pull_request') {
            $envLine = Get-Content -LiteralPath '.\publish\.env' -Raw
            if ($envLine -notmatch '^GELITA_TOOLKIT_SIGNER_THUMBPRINT=[A-F0-9]{40,64}\s*$') { throw 'Configuração do thumbprint ausente ou inválida.' }
            $signature = Get-AuthenticodeSignature -LiteralPath '.\publish\Gelita-IT-Toolkit.exe'
            if ($signature.Status -ne 'Valid') { throw 'Executável não possui assinatura válida.' }
          }
          Get-ChildItem .\publish\Config\*.json | ForEach-Object {
            Get-Content -LiteralPath $_.FullName -Raw | ConvertFrom-Json | Out-Null
          }

      - name: Gerar ZIP e SHA-256
        id: package
        shell: pwsh
        run: |
          $baseName = "Gelita-IT-Toolkit-v${{ steps.version.outputs.version }}-win-x64"
          $zipPath = Join-Path $PWD "$baseName.zip"
          $hashPath = Join-Path $PWD "$baseName.zip.sha256"
          $packageItems = @('.\publish\*')
          if (Test-Path -LiteralPath '.\publish\.env') { $packageItems += '.\publish\.env' }
          Compress-Archive -Path $packageItems -DestinationPath $zipPath -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zipPath).Hash
          "$hash  $baseName.zip" | Set-Content -LiteralPath $hashPath -Encoding ascii
          "zip=$zipPath" >> $env:GITHUB_OUTPUT
          "hash=$hashPath" >> $env:GITHUB_OUTPUT

      - name: Publicar na release da versão atual
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target "${{ github.sha }}" --title $tag --notes "Pacote automático da versão atual."
          }
          gh release upload $tag "${{ steps.package.outputs.zip }}" "${{ steps.package.outputs.hash }}" --clobber
