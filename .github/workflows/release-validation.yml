name: Release validation
on:
  push:
    branches: ['release/1.0.7']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Reject local credentials, inventories and installer files
        shell: powershell
        run: |
          $forbidden = git ls-files | Where-Object {
            $_ -match '(^|/)(artifacts|release-worktree-[^/]+|Cache)/' -or
            $_ -match '(^|/)\.env$|(?i)token.*\.txt$|\.(pfx|p12|key)$' -or
            $_ -match '^Assets/.*\.(exe|msi|msu)$' -or
            $_ -match '^Config/(printers|scanners|units)\.json$'
          }
          if ($forbidden) { throw 'Local files must not be tracked in the public source.' }
      - name: Restore with dependency audit
        run: dotnet restore Gelita-IT-Toolkit.csproj -p:NuGetAudit=true -p:NuGetAuditMode=all -warnaserror:NU1901,NU1902,NU1903,NU1904
      - name: Checks without changing drivers or Citrix accounts
        timeout-minutes: 4
        run: dotnet run --project Tests/ReleaseChecks/ReleaseChecks.csproj --configuration Release -p:TreatWarningsAsErrors=false -- .
      - name: Package public release
        shell: powershell
        run: ./Scripts/Publish-Release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: public-release
          path: |
            dist/**/Gelita-IT-Toolkit-*-win-x64.zip
            dist/**/Gelita-IT-Toolkit-*-win-x64.zip.sha256
